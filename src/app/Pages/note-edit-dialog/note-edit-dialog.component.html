<div class="keep-dialog" [style.background]="note.color || '#fff'">

  <!-- PIN -->
  <button class="pin-btn" (click)="note.pinned = !note.pinned">
    <mat-icon>{{ note.pinned ? 'push_pin' : 'push_pin' }}</mat-icon>
  </button>

  <!-- TITLE -->
  <input
    class="keep-title"
    placeholder="Title"
    [(ngModel)]="note.title"
  />

  <!-- DESCRIPTION -->
  <textarea
    class="keep-desc"
    placeholder="Take a note..."
    [(ngModel)]="note.description">
  </textarea>

  <!-- ACTIONS -->
  <div class="keep-actions">

    <div class="actions-left">
      <mat-icon>notifications</mat-icon>
      <mat-icon>palette</mat-icon>
      <mat-icon>image</mat-icon>
      <mat-icon>archive</mat-icon>
      <mat-icon>more_vert</mat-icon>
    </div>

    <span class="close-text" (click)="close()">Close</span>

  </div>

</div>
